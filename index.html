<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c68">
  <meta name="description" content="Sorteador de letras para jogar STOP. 26 letras, sem repetição.">
  <title>ÔÔÔÔ STÓÓÓPÊ!</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="eyebrow">O GRANDE SORTEIO</div>
      <h1>ÔÔÔÔ <span>STÓÓÓPÊ!</span></h1>
      <p class="subtitle">O peão vai escolher a letra da rodada!</p>
    </header>

    <section class="game" aria-label="Sorteador de letras">
      <div class="peao-wrap">
        <div class="peao" id="peao">
          <svg id="wheel" viewBox="0 0 500 500" role="img" aria-label="Peão com as 26 letras do alfabeto">
            <defs>
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="5"/>
              </filter>
              <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fffde8"/>
                <stop offset="1" stop-color="#e8e4c9"/>
              </linearGradient>
              <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff3a35"/>
                <stop offset="1" stop-color="#b90012"/>
              </linearGradient>
            </defs>
            <circle cx="250" cy="250" r="239" fill="#050505" opacity=".42" filter="url(#shadow)"/>
            <g id="blades"></g>
            <circle cx="250" cy="250" r="112" fill="url(#red)" stroke="#7b0008" stroke-width="5"/>
            <circle cx="250" cy="250" r="91" fill="#090909" stroke="#f0443d" stroke-width="5"/>
            <text id="centerLetter" x="250" y="273" text-anchor="middle">?</text>
          </svg>
        </div>
      </div>

      <div class="result-line">
        <span class="result-label">LETRA DA RODADA</span>
        <strong id="result">?</strong>
      </div>

      <button id="spinButton" class="spin-button" type="button">GIRAR O PEÃO</button>
      <div class="status"><span id="round">0</span> / 26 rodadas <span class="dot">•</span> <span id="remaining">26 letras disponíveis</span></div>
    </section>

    <section class="history-section">
      <div class="history-heading">
        <h2>LETRAS QUE JÁ SAÍRAM</h2>
        <button id="resetButton" class="reset-button" type="button">Reiniciar</button>
      </div>
      <div id="history" class="history" aria-live="polite">
        <span class="empty">As letras sorteadas aparecerão aqui.</span>
      </div>
    </section>

    <footer>
      <button id="installButton" class="install-button" type="button" hidden>
        <span aria-hidden="true">⇩</span> INSTALAR APLICATIVO
      </button>
      <p>Um sorteio por letra. Sem repetição. Até a 26ª rodada!</p>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./script.js"></script>
</body>
</html>
